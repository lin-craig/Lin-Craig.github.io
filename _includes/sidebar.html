<aside class="profile" aria-label="Profile">
  <img
    class="profile-photo"
    src="{{ '/images/' | append: site.author.avatar | relative_url }}"
    alt="Portrait of {{ site.author.name }}"
    width="180"
    height="180"
  >
  <h2>{{ site.author.name }}</h2>
  <p class="profile-bio">{{ site.author.bio }}</p>
  <ul class="profile-links">
    <li>
      <a href="mailto:{{ site.author.email }}" aria-label="Email {{ site.author.name }}">
        <span aria-hidden="true">✉</span> Email
      </a>
    </li>
    {% if site.author.linkedin %}
      <li>
        <a href="https://www.linkedin.com/in/{{ site.author.linkedin }}/" target="_blank" rel="noopener noreferrer">
          <span aria-hidden="true">in</span> LinkedIn
        </a>
      </li>
    {% endif %}
  </ul>
</aside>
