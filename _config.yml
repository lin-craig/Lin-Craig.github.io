# Site identity
title: "Craig Lin"
description: "Personal academic website of Yan (Craig) Lin, focusing on wireless communications, networked systems, and intelligent resource allocation."
url: "https://lin-craig.github.io"
baseurl: ""
locale: "en-US"
timezone: "Etc/UTC"

# Sidebar profile
author:
  name: "Craig Lin"
  avatar: "yan-craig-lin.jpg"
  bio: "Wireless Communications · Networked Systems"
  email: "linyan2021@outlook.com"
  # Leave blank to hide LinkedIn. Set to "limyen" to show it again.
  linkedin:

# Page defaults
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single

# Jekyll settings
markdown: kramdown
permalink: /:title/
plugins:
  - jekyll-sitemap

include:
  - _pages

exclude:
  - .bundle
  - .git
  - .github
  - .sass-cache
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor
